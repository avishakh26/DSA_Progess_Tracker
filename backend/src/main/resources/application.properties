# Retained for reference only — this module no longer runs Spring Boot.
#
# The desktop client opens the SQLite file directly through JDBC. The location
# is resolved at runtime by com.dsajourney.desktop.db.Database and can be
# overridden with -Ddsa.db=<path to prisma/dev.db>.
#
# The previous JPA settings are deliberately inactive. Two of them were unsafe
# against this database:
#   spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
#       -> no such class in Hibernate core; it lives in hibernate-community-dialects
#   spring.jpa.hibernate.ddl-auto=update
#       -> would let Hibernate rewrite the schema Prisma owns, on live data
